<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Premium Multichain Wallet dApp</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Correct WalletConnect v2 UMD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/@walletconnect/sign-client/2.10.1/sign-client.umd.min.js"></script>

  <!-- Ethers.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.8.1/ethers.umd.min.js"></script>
</head>

<body>
  <div class="main-container">
    <h1 class="title">Premium Multichain Wallet dApp</h1>

    <button id="connectBtn" class="connect-btn">Connect Wallet</button>

    <div id="dashboard" class="dashboard" style="display:none;">
      <h2>Wallet Dashboard</h2>
      <p><strong>Address:</strong> <span id="addr"></span></p>
      <p><strong>Chain:</strong> <span id="chain"></span></p>
      <p><strong>Native Balance:</strong> <span id="bal"></span></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
